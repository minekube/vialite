name: Craftless compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/craftless.yml'
      - 'test/craftless/**'
      - 'go/**'
      - 'build/**'
      - 'Taskfile.yml'
      - 'mise.toml'
  # Acceptance note — every vialite release records a failed `pull_request` run
  # for this workflow, and ci.yml records a second one: two red runs per
  # release, each having executed no job at all, neither of which can go green.
  # It is not a broken job and not this `paths` filter: it is GitHub's
  # documented approval gate for pull requests that a workflow created with
  # `GITHUB_TOKEN`.
  #
  #   "When a pull request is created or updated by a workflow using
  #    `GITHUB_TOKEN`, `pull_request` events with the `opened`, `synchronize`,
  #    or `reopened` activity types create workflow runs that require approval.
  #    A user with write access to the repository can approve these runs from
  #    the pull request page. With the exception of `workflow_dispatch` and
  #    `repository_dispatch`, other `GITHUB_TOKEN`-triggered events do not
  #    create workflow runs at all."
  #   — GitHub docs, "Events that trigger workflows" -> `pull_request`
  #
  # Vialite is the worst-affected repository: ci.yml carries the same gate, so
  # one release costs two red checks.
  #
  # The release PR matches these paths on purpose. release-please rewrites
  # `go/version.go` (declared under "extra-files" in
  # .release-please-config.json; PR #37 added the `x-release-please-version`
  # annotation its generic updater matches) together with
  # `.release-please-manifest.json` and `CHANGELOG.md`, so `go/**` matches. A
  # workflow whose filter does *not* match creates no run at all, which is the
  # control: `native-image.yml` (filter `build/**`, its own file) has never
  # produced a run on a release PR.
  #
  # Measured, read-only, 2026-09-27: release 0.3.7 (PR #41, head 0c57342c)
  # produced runs 36312571624 (`Craftless compatibility`) and 36312571573
  # (`CI`); release 0.3.6 (PR #39, head 26408d9a) produced 36204128261 and
  # 36204128268. All four are `event=pull_request`,
  # `actor=github-actions[bot]`, `jobs.total_count=0`, `conclusion=failure`, and
  # they are the only `github-actions[bot]` pull_request runs in this
  # repository's whole action history. While the release PR is open GitHub
  # presents such a run as awaiting approval; once the PR is merged unapproved
  # it is recorded as `failure`, and the release-branch commit and the Actions
  # list are where it stays visible — the release-PR head itself carries no
  # check-runs at all (GET /repos/minekube/vialite/commits/0c57342c/check-runs
  # -> total_count=0), so not even a red job context is reported on a release
  # branch. The same boundary is visible in the
  # history: release PRs 0.3.1-0.3.5 (PR #33, #35, #38) touched only the
  # manifest and the changelog, matched neither this filter nor ci.yml's, and
  # produced **no** runs — the phantom pair starts exactly with 0.3.6, the first
  # release PR carrying `go/version.go`.
  #
  # Therefore: no check context this workflow reports — neither the workflow
  # entry `Craftless compatibility` nor the job names `validate Craftless
  # matrix`, `build PR subprocess linux amd64` and the per-row
  # `subprocess client <v> -> server <v>` — may be required. Those contexts must
  # never become required status checks on `main`. A release PR can never
  # satisfy them: the gated run executes no job and the release branch reports
  # no check-runs, so a required context would sit expected-and-never-reported,
  # release-please's auto-merge step (release-please.yml, `gh pr merge`) would
  # fail, and the release chain would stall on every release instead of merging
  # itself. This
  # workflow is the slower of the two by far, so requiring it would also block
  # the chain for an hour per release. `main` requires nothing today: GET
  # /repos/minekube/vialite/branches/main/protection -> 404 "Branch not
  # protected" when read with an installation token that carries
  # `administration: read` (the same call returns `contexts=['lint-test']` for
  # minekube/geyserlite, so the read scope is proven), and release-please.yml
  # mirrors no context at all here — there is no mirror that could satisfy a
  # required gated check.
  #
  # Do not "fix" the red check by editing this filter. Dropping `paths` cannot
  # remove the approval-gated run, and a filter that stops matching only turns
  # the red check into a *missing* one — just as unsatisfiable, and the release
  # PR loses the only (vacuous) check-run it currently shows. The only real fix
  # is a credential change: release-please opening its PR with a GitHub App/PAT
  # token, which is a maintainer decision, not a workflow edit.
  #
  # go/release_check_contract_test.go pins all of the above. When it fails,
  # re-decide this note — do not delete the guard.
  pull_request:
    paths:
      - '.github/workflows/craftless.yml'
      - 'test/craftless/**'
      - 'go/**'
      - 'build/**'
      - 'Taskfile.yml'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAFTLESS_REPOSITORY: minekube/craftless
  CRAFTLESS_REF: df55f652ce16052604c6776e0c50e9a29eb6ac66

jobs:
  validate-matrix:
    name: validate Craftless matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out vialite
        uses: actions/checkout@v7

      - name: Validate vialite target matrix
        run: python3 test/craftless/validate-matrix.py test/craftless/matrix.json

      - name: Build GitHub matrix from enabled rows
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path("test/craftless/matrix.json").read_text())
          include = []
          for row in data["rows"]:
              if row.get("enabled") is not True:
                  continue
              include.append(
                  {
                      "mode": row["mode"],
                      "client-version": row["clientVersion"],
                      "server-version": row["serverVersion"],
                      "case": row["case"],
                  }
              )
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  build-subprocess-linux-amd64:
    name: build PR subprocess linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read GraalVM image pin
        id: pins
        run: echo "graalvm=$(tr -d '[:space:]' < build/graalvm.version)" >> "$GITHUB_OUTPUT"

      - name: Build Linux amd64 native artifacts
        run: |
          docker build \
            -f build/Dockerfile \
            --build-arg GRAALVM_IMAGE="${{ steps.pins.outputs.graalvm }}" \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --target executable \
            -t ghcr.io/minekube/vialite:native-craftless-amd64 \
            .

      - name: Extract Linux amd64 artifacts
        run: |
          mkdir -p artifacts
          id="$(docker create ghcr.io/minekube/vialite:native-craftless-amd64)"
          docker cp "$id:/out/." artifacts/
          docker rm "$id"
          ls -la artifacts
          test -f artifacts/vialite-linux-amd64
          chmod +x artifacts/vialite-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: vialite-pr-native-linux-amd64
          path: artifacts/
          if-no-files-found: error

  real-client-smoke:
    name: ${{ matrix.mode }} client ${{ matrix.client-version }} -> server ${{ matrix.server-version }}
    needs: [validate-matrix, build-subprocess-linux-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate-matrix.outputs.matrix) }}
    steps:
      - name: Check out vialite
        uses: actions/checkout@v7
        with:
          path: vialite

      - name: Check out Craftless
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CRAFTLESS_REPOSITORY }}
          ref: ${{ env.CRAFTLESS_REF }}
          path: craftless

      - name: Download PR native artifacts
        uses: actions/download-artifact@v7
        with:
          name: vialite-pr-native-linux-amd64
          path: vialite-native

      - name: Verify PR native artifacts
        run: |
          test -f vialite-native/vialite-linux-amd64
          chmod +x vialite-native/vialite-linux-amd64

      - name: Install Linux client runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libopenal1 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libxtst6 \
            libxxf86vm1

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vialite/go/go.mod
          cache-dependency-path: vialite/go/go.sum

      - name: Build smoke command JSON
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os

          root = os.environ["GITHUB_WORKSPACE"]
          action_command = [
              "go",
              "-C",
              f"{root}/vialite/go",
              "run",
              "./cmd/craftless-vialite-smoke-proxy",
          ]
          client_command = [
              "xvfb-run",
              "-a",
              "mise",
              "exec",
              "--",
              "gradle",
              "-p",
              f"{root}/craftless",
              ":driver-fabric:runClient",
          ]
          print("CRAFTLESS_SMOKE_ACTION_COMMAND_JSON=" + json.dumps(action_command))
          print("VIALITE_SMOKE_CLIENT_COMMAND_JSON=" + json.dumps(client_command))
          PY

      - name: Run Craftless real-client smoke through Vialite
        working-directory: craftless
        env:
          CRAFTLESS_FABRIC_CLIENT_SMOKE: "1"
          CRAFTLESS_LOCAL_SERVER_SMOKE_ROOT: ${{ github.workspace }}/craftless-smoke/${{ matrix.mode }}-${{ matrix.case }}
          CRAFTLESS_SMOKE_MINECRAFT_VERSION: ${{ matrix.server-version }}
          CRAFTLESS_SMOKE_ACTION_TIMEOUT_MS: "1200000"
          CRAFTLESS_FABRIC_SMOKE_CHAT_MESSAGE: vialite ${{ matrix.mode }} ${{ matrix.case }}
          CRAFTLESS_SMOKE_EXPECT_DISCONNECT: "1"
          VIALITE_SMOKE_MODE: ${{ matrix.mode }}
          VIALITE_SMOKE_BINARY_PATH: ${{ github.workspace }}/vialite-native/vialite-linux-amd64
          VIALITE_SMOKE_BACKEND_VERSION: auto
          VIALITE_SMOKE_GATE_PROTOCOL: auto
          VIALITE_SMOKE_READY_TIMEOUT: 2m
          VIALITE_SMOKE_STOP_TIMEOUT: 30s
        run: |
          mise install
          mise exec -- gradle :driver-fabric:fabricClientSmoke --no-daemon

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: craftless-vialite-${{ matrix.mode }}-${{ matrix.case }}
          path: craftless-smoke/${{ matrix.mode }}-${{ matrix.case }}/artifacts/
          if-no-files-found: ignore
