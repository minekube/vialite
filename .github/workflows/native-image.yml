name: Build native image

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/native-image.yml'
  pull_request:
    paths:
      - 'build/**'
      - '.github/workflows/native-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Read GraalVM image pin
        id: pins
        run: echo "graalvm=$(tr -d '[:space:]' < build/graalvm.version)" >> "$GITHUB_OUTPUT"

      - name: Build Linux native artifacts
        run: |
          docker build \
            -f build/Dockerfile \
            --build-arg GRAALVM_IMAGE="${{ steps.pins.outputs.graalvm }}" \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --target shared \
            -t ghcr.io/minekube/vialite:native-ci-${{ matrix.arch }} \
            .

      - name: Verify arm64 native artifacts target 64 KiB pages
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          # A GraalVM native image bakes in the *build host's* page size and may
          # only run where the run-time page size is <= that value
          # (SubstrateOptions.getPageSize()). This runner has 4 KiB pages, so an
          # image built without -H:PageSize cannot start on a 16 KiB kernel
          # (Raspberry Pi 5 firmware's kernel_2712.img, Asahi Linux) and dies
          # before main with "Fatal error: Failed to create the main Isolate."
          # v0.3.11 shipped exactly that way. build/overlay/vialite-native/
          # build.gradle.kts now passes -H:PageSize=65536 for Linux aarch64;
          # assert the built files really carry it, so a runner or GraalVM pin
          # change fails here instead of on an operator's Pi.
          id="$(docker create ghcr.io/minekube/vialite:native-ci-arm64)"
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          mkdir -p pagecheck
          docker cp "$id:/out/." pagecheck/
          status=0
          for artifact in pagecheck/vialite-linux-arm64 pagecheck/libvialite-linux-arm64.so; do
            echo "== $artifact"
            readelf -SW "$artifact" | grep -E '\.(text|rodata|svm_heap|data)\b' || true
            for section in .text .rodata .svm_heap .data; do
              align="$(readelf -SW "$artifact" | awk -v s="$section" '{ for (i = 1; i <= NF; i++) if ($i == s) { print $NF; exit } }')"
              if [ -z "$align" ]; then
                echo "::error file=$artifact::$section is missing from the image, so its page alignment cannot be checked"
                status=1
              elif [ "$align" -lt 65536 ]; then
                echo "::error file=$artifact::$section is aligned to $align bytes, want at least 65536: the image carries this runner's 4 KiB page size and cannot start on a 16 KiB-page kernel (Raspberry Pi 5 default kernel, Asahi Linux) - check -H:PageSize in build/overlay/vialite-native/build.gradle.kts"
                status=1
              fi
            done
          done
          exit "$status"

      - name: Extract Linux artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          id="$(docker create ghcr.io/minekube/vialite:native-ci-${{ matrix.arch }})"
          docker cp "$id:/out/." artifacts/
          docker rm "$id"
          ls -la artifacts
          test -f artifacts/libvialite-linux-${{ matrix.arch }}.so
          test -f artifacts/vialite-linux-${{ matrix.arch }}
          grep -E 'vialite_init.*graal_isolatethread_t' artifacts/libvialite.h

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: vialite-linux-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply ViaProxy overlay
        shell: bash
        run: bash build/apply-overlay.sh

      - name: Build Windows executable
        shell: pwsh
        run: |
          $root = Get-Location
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsInstall) {
            throw "Visual Studio with MSVC x64 tools not found"
          }
          $vcvars = Join-Path $vsInstall "VC/Auxiliary/Build/vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }

          Set-Location build/.work/ViaProxy
          cmd /c "`"$vcvars`" && gradlew.bat :vialite-native:nativeCompile --no-daemon --no-configuration-cache -Pvialite.native.shared=false"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          New-Item -ItemType Directory -Force "$root/artifacts" | Out-Null
          Copy-Item vialite-native/build/native/nativeCompile/vialite.exe "$root/artifacts/vialite-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: vialite-windows-amd64
          path: artifacts/
          if-no-files-found: error
